# Application-level alarm settings loaded by `AlarmConfiguration`.
shas {
  correctPin = "1234"
  exitDelay = 5 seconds
  entryDelay = 5 seconds
}

# Pekko runtime configuration for the clustered deployment.
pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    # Typed actors are hosted in a cluster-enabled provider.
    provider = "cluster"

    # All remotely exchanged messages implement `pcd.shas.common.MySerializable`.
    serialization-bindings {
      "pcd.shas.common.MySerializable" = jackson-json
    }
  }

  remote {
    artery {
      canonical {
        # Default loopback binding, overridden by the node startup arguments.
        hostname = "127.0.0.1"
        port = 0
      }
    }
  }

  cluster {
    # Distributed startup commands and the process demo use these seed nodes.
    seed-nodes = [
      "pekko://shas-cluster@127.0.0.1:2551",
      "pekko://shas-cluster@127.0.0.1:2552"
    ]
    # Keep startup responsive when nodes are launched individually.
    seed-node-timeout = 1s
    retry-unsuccessful-join-after = 1s
    # Split-brain resolution is part of the cluster topology contract.
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
}
