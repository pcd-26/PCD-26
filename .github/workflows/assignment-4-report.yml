name: Assignment 4 Report CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build-report:
    name: Build assignment-4 report PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Build report
        working-directory: assignment-4/cshas/report
        run: make

      - name: Prepare delivery metadata
        id: delivery_meta
        shell: bash
        run: |
          set -euo pipefail

          stamp="$(date -u +'%Y%m%d-%H%M%S')-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "zip_name=Assignment-04-$stamp.zip" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-04/cshas/doc

          cp assignment-4/cshas/pom.xml package/Assignment-04/cshas/pom.xml
          cp -R assignment-4/cshas/src package/Assignment-04/cshas/src
          cp assignment-4/cshas/report/report.pdf package/Assignment-04/cshas/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-04)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-04/cshas/pom.xml
          test -d package/Assignment-04/cshas/src/main
          test -d package/Assignment-04/cshas/src/test
          test -f package/Assignment-04/cshas/doc/report.pdf
          test ! -e package/Assignment-04/report
          test ! -e package/Assignment-04/docs
          test ! -e package/Assignment-04/target
          test ! -e package/Assignment-04/cshas/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-04-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}
