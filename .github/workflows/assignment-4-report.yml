name: Assignment 4 Report CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build-report:
    name: Build assignment-4 report PDF
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Build report
        working-directory: assignment-4/report
        run: make

      - name: Prepare delivery metadata
        id: delivery_meta
        shell: bash
        run: |
          set -euo pipefail

          stamp="$(date -u +'%Y%m%d-%H%M%S')-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "zip_name=Assignment-04-$stamp.zip" >> "$GITHUB_OUTPUT"
          echo "release_zip_name=Assignment-04-latest.zip" >> "$GITHUB_OUTPUT"
          echo "release_tag=latest" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-04/doc

          cp assignment-4/report/report.pdf package/Assignment-04/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-04)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-04/doc/report.pdf
          test ! -e package/Assignment-04/report
          test ! -e package/Assignment-04/docs
          test ! -e package/Assignment-04/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: Assignment-04-${{ steps.delivery_meta.outputs.stamp }}
          path: ${{ steps.delivery_meta.outputs.zip_name }}

      - name: Publish delivery release
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
          RELEASE_ZIP: ${{ steps.delivery_meta.outputs.release_zip_name }}
          RELEASE_TAG: ${{ steps.delivery_meta.outputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cp "$DELIVERY_ZIP" "$RELEASE_ZIP"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            :
          else
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "Latest Assignment Packages" \
              --notes "Shared release for the latest assignment delivery zips. New assets replace the previous delivery packages on successful workflow runs."
          fi

          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" --clobber; then
              exit 0
            fi
            sleep "$attempt"
          done

          echo "failed to upload release asset after retries" >&2
          exit 1
