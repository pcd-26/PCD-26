name: Assignment 4 Validation CI

on:
  push:
    paths:
      - "assignment-4/**"
      - ".github/workflows/assignment-4-report.yml"
  pull_request:
    paths:
      - "assignment-4/**"
      - ".github/workflows/assignment-4-report.yml"
  workflow_dispatch:

concurrency:
  group: assignment-4-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  cshas:
    name: Validate assignment-4/cshas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test CSHAS
        working-directory: assignment-4/cshas
        run: mvn -B clean test

      - name: Upload CSHAS test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-4-cshas-test-reports
          path: assignment-4/cshas/target/surefire-reports
          if-no-files-found: ignore

  dttt:
    name: Validate assignment-4/dttt
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify DTTT
        working-directory: assignment-4/dttt
        run: mvn -B clean verify

      - name: Upload DTTT test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-4-dttt-test-reports
          path: assignment-4/dttt/target/surefire-reports
          if-no-files-found: ignore
