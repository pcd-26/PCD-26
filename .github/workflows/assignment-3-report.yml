name: Assignment 03 CI

on:
  pull_request:
    paths:
      - "assignment-3/**"
      - ".github/workflows/assignment-3-report.yml"
  push:
    paths:
      - "assignment-3/**"
      - ".github/workflows/assignment-3-report.yml"
  workflow_dispatch:
    inputs:
      test_selector:
        description: "Optional Maven -Dtest selector for the SHAS module"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shas:
    name: Test assignment-03 SHAS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test Smart Home Alarm System (Java)
        working-directory: assignment-3/smart-home-alarm-system
        env:
          MAVEN_SETTINGS: ${{ github.workspace }}/.mvn/settings.xml
          TEST_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.test_selector || '' }}
        run: |
          if [ -n "$TEST_SELECTOR" ]; then
            mvn -B -s "$MAVEN_SETTINGS" clean test -Dtest="$TEST_SELECTOR"
          else
            mvn -B -s "$MAVEN_SETTINGS" clean test
          fi

  test-oeg:
    name: Test assignment-03 Odds and Evens Game
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and test Odds and Evens Game (Go)
        working-directory: assignment-3/odds-and-evens-game/src
        run: go test -v ./...

  package:
    name: Build Assignment-03 zip
    runs-on: ubuntu-latest
    needs:
      - test-shas
      - test-oeg
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache APT archives for packaging tools
        uses: actions/cache@v4
        with:
          path: .apt-cache/archives
          key: ${{ runner.os }}-apt-assignment-3-packaging-v1

      - name: Install packaging tools
        env:
          APT_ARCHIVES: ${{ github.workspace }}/.apt-cache/archives
        run: |
          mkdir -p "$APT_ARCHIVES/partial"
          sudo apt-get update
          sudo apt-get -o dir::cache::archives="$APT_ARCHIVES" install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra zip unzip

      - name: Build Smart Home Alarm System report
        working-directory: assignment-3/smart-home-alarm-system/report
        run: make

      - name: Build Odds and Evens Game report
        working-directory: assignment-3/odds-and-evens-game/report
        run: make

      - name: Prepare delivery metadata
        id: delivery_meta
        shell: bash
        run: echo "zip_name=Assignment-03.zip" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-03/smart-home-alarm-system/doc
          mkdir -p package/Assignment-03/odds-and-evens-game/doc

          cp assignment-3/smart-home-alarm-system/pom.xml package/Assignment-03/smart-home-alarm-system/pom.xml
          cp -R assignment-3/smart-home-alarm-system/src package/Assignment-03/smart-home-alarm-system/src
          cp assignment-3/smart-home-alarm-system/report/report.pdf package/Assignment-03/smart-home-alarm-system/doc/report.pdf

          cp -R assignment-3/odds-and-evens-game/src package/Assignment-03/odds-and-evens-game/src
          cp assignment-3/odds-and-evens-game/report/report.pdf package/Assignment-03/odds-and-evens-game/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-03)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-03/smart-home-alarm-system/doc/report.pdf
          test -f package/Assignment-03/odds-and-evens-game/doc/report.pdf
          test -f package/Assignment-03/smart-home-alarm-system/pom.xml
          test -d package/Assignment-03/smart-home-alarm-system/src/main
          test -d package/Assignment-03/smart-home-alarm-system/src/test
          test -f package/Assignment-03/odds-and-evens-game/src/main.go
          test -f package/Assignment-03/odds-and-evens-game/src/go.mod
          test -d package/Assignment-03/odds-and-evens-game/src/tests
          test ! -e package/Assignment-03/doc
          test ! -e package/Assignment-03/report
          test ! -e package/Assignment-03/docs
          test ! -e package/Assignment-03/target
          test ! -e package/Assignment-03/smart-home-alarm-system/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-03-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" "$DELIVERY_ZIP" --clobber
