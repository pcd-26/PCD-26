name: Assignment 3 Report CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test-shas:
    name: Test assignment-3 SHAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test SHAS (Java)
        working-directory: assignment-3/shas
        run: mvn -B clean test

  test-hotc:
    name: Test assignment-3 HOTC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and test HOTC (Go)
        working-directory: assignment-3/hotc/src
        run: go test -v ./...

  build-shas-report:
    name: Build assignment-3 SHAS report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base

      - name: Build SHAS report
        working-directory: assignment-3/shas/report
        run: make

  build-hotc-report:
    name: Build assignment-3 HOTC report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base

      - name: Build HOTC report
        working-directory: assignment-3/hotc/report
        run: make
