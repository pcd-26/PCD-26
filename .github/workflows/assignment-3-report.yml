name: Assignment 03 CI

on:
  pull_request:
    paths:
      - "assignment-3/**"
      - ".github/workflows/assignment-3-report.yml"
  push:
    paths:
      - "assignment-3/**"
      - ".github/workflows/assignment-3-report.yml"
  workflow_dispatch:
    inputs:
      test_selector:
        description: "Optional Maven -Dtest selector for the SHAS module"
        required: false
        default: ""

jobs:
  test-shas:
    name: Test assignment-03 SHAS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test SHAS (Java)
        working-directory: assignment-3/shas
        env:
          TEST_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.test_selector || '' }}
        run: |
          if [ -n "$TEST_SELECTOR" ]; then
            mvn -B clean test -Dtest="$TEST_SELECTOR"
          else
            mvn -B clean test
          fi

  test-hotc:
    name: Test assignment-03 HOTC
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and test HOTC (Go)
        working-directory: assignment-3/hotc/src
        run: go test -v ./...

  package:
    name: Build Assignment-03 zip
    runs-on: ubuntu-latest
    needs:
      - test-shas
      - test-hotc
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra zip unzip

      - name: Build SHAS report
        working-directory: assignment-3/shas/report
        run: make

      - name: Build HOTC report
        working-directory: assignment-3/hotc/report
        run: make

      - name: Prepare delivery metadata
        id: delivery_meta
        shell: bash
        run: echo "zip_name=Assignment-03.zip" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-03/shas/doc
          mkdir -p package/Assignment-03/hotc/doc

          cp assignment-3/shas/pom.xml package/Assignment-03/shas/pom.xml
          cp -R assignment-3/shas/src package/Assignment-03/shas/src
          cp assignment-3/shas/report/report.pdf package/Assignment-03/shas/doc/report.pdf

          cp -R assignment-3/hotc/src package/Assignment-03/hotc/src
          cp assignment-3/hotc/report/report.pdf package/Assignment-03/hotc/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-03)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-03/shas/doc/report.pdf
          test -f package/Assignment-03/hotc/doc/report.pdf
          test -f package/Assignment-03/shas/pom.xml
          test -d package/Assignment-03/shas/src/main
          test -d package/Assignment-03/shas/src/test
          test -f package/Assignment-03/hotc/src/main.go
          test -f package/Assignment-03/hotc/src/go.mod
          test ! -e package/Assignment-03/doc
          test ! -e package/Assignment-03/report
          test ! -e package/Assignment-03/docs
          test ! -e package/Assignment-03/target
          test ! -e package/Assignment-03/shas/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-03-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}
