name: Assignment 3 Report CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build-report:
    name: Build and test assignment-3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and test SHAS (Java)
        working-directory: assignment-3/shas
        run: mvn -B clean test

      - name: Build and test HOTC (Go)
        working-directory: assignment-3/hotc/src
        run: go test -v ./...

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Build report
        working-directory: assignment-3/shas/report
        run: make

      - name: Prepare delivery metadata
        id: delivery_meta
        shell: bash
        run: |
          set -euo pipefail

          stamp="$(date -u +'%Y%m%d-%H%M%S')-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "zip_name=Assignment-03-$stamp.zip" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-03/doc
          mkdir -p package/Assignment-03/src/shas
          mkdir -p package/Assignment-03/src/hotc

          cp assignment-3/shas/report/report.pdf package/Assignment-03/doc/report.pdf
          cp assignment-3/shas/pom.xml package/Assignment-03/src/shas/pom.xml
          cp -R assignment-3/shas/src package/Assignment-03/src/shas/src
          cp -R assignment-3/hotc/src package/Assignment-03/src/hotc/src

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-03)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-03/doc/report.pdf
          test -f package/Assignment-03/src/shas/pom.xml
          test -d package/Assignment-03/src/shas/src/main
          test -d package/Assignment-03/src/shas/src/test
          test -f package/Assignment-03/src/hotc/src/main.go
          test -f package/Assignment-03/src/hotc/src/go.mod
          test ! -e package/Assignment-03/report
          test ! -e package/Assignment-03/docs
          test ! -e package/Assignment-03/target
          test ! -e package/Assignment-03/src/shas/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-03-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}
