name: Assignment 2 Tests CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      test_selector:
        description: "Optional Maven -Dtest selector, for example FSStatTest or FSStatTest#someMethod"
        required: false
        default: ""

jobs:
  test:
    name: Build and test assignment-2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Build and test
        working-directory: assignment-2
        env:
          TEST_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.test_selector || '' }}
        run: |
          if [ -n "$TEST_SELECTOR" ]; then
            mvn -B clean test -Dtest="$TEST_SELECTOR"
          else
            mvn -B clean test
          fi

  package:
    name: Build Assignment-02 zip
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare delivery metadata
        id: delivery_meta
        shell: bash
        run: |
          set -euo pipefail

          stamp="$(date -u +'%Y%m%d-%H%M%S')-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "zip_name=Assignment-02-$stamp.zip" >> "$GITHUB_OUTPUT"
          echo "release_zip_name=Assignment-02-latest.zip" >> "$GITHUB_OUTPUT"
          echo "release_tag=latest" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-02/doc

          make -C assignment-2/report

          cp assignment-2/pom.xml package/Assignment-02/pom.xml
          cp -R assignment-2/src package/Assignment-02/src
          cp assignment-2/report/report.pdf package/Assignment-02/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-02)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-02/pom.xml
          test -d package/Assignment-02/src/main
          test -d package/Assignment-02/src/test
          test -f package/Assignment-02/doc/report.pdf
          test ! -e package/Assignment-02/docs
          test ! -e package/Assignment-02/report
          test ! -e package/Assignment-02/target
          test ! -e package/Assignment-02/.agents
          test ! -e package/Assignment-02/README.md
          test ! -e package/Assignment-02/run-cli.sh
          test ! -e package/Assignment-02/run-cli.ps1
          test ! -e package/Assignment-02/run-gui.sh
          test ! -e package/Assignment-02/run-gui.ps1

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: Assignment-02-${{ steps.delivery_meta.outputs.stamp }}
          path: ${{ steps.delivery_meta.outputs.zip_name }}

      - name: Publish delivery release
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
          RELEASE_ZIP: ${{ steps.delivery_meta.outputs.release_zip_name }}
          RELEASE_TAG: ${{ steps.delivery_meta.outputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cp "$DELIVERY_ZIP" "$RELEASE_ZIP"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            :
          else
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "Latest Assignment Packages" \
              --notes "Shared release for the latest assignment delivery zips. New assets replace the previous delivery packages on successful workflow runs."
          fi

          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" --clobber; then
              exit 0
            fi
            sleep "$attempt"
          done

          echo "failed to upload release asset after retries" >&2
          exit 1
