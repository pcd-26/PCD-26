name: Assignment 1 Tests CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      test_selector:
        description: "Optional Maven -Dtest selector, for example BoardTest or BoardTest#initializesFromConfig"
        required: false
        default: ""

jobs:
  test:
    name: Build and test assignment-1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r assignment-1/requirements.txt

      - name: Build and test
        working-directory: assignment-1
        env:
          TEST_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.test_selector || '' }}
        run: |
          if [ -n "$TEST_SELECTOR" ]; then
            mvn -B clean test -Dtest="$TEST_SELECTOR"
          else
            mvn -B clean verify
          fi

  package:
    name: Build Assignment-01 zip
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare delivery metadata
        id: delivery_meta
        shell: bash
        run: |
          set -euo pipefail

          stamp="$(date -u +'%Y%m%d-%H%M%S')-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "zip_name=Assignment-01-$stamp.zip" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Build report PDF
        working-directory: assignment-1/report
        run: make

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-01/doc

          cp assignment-1/pom.xml package/Assignment-01/pom.xml
          cp -R assignment-1/src package/Assignment-01/src
          cp assignment-1/report/report.pdf package/Assignment-01/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-01)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-01/doc/report.pdf
          test -f package/Assignment-01/pom.xml
          test -d package/Assignment-01/src/main
          test -d package/Assignment-01/src/test
          test ! -e package/Assignment-01/docs
          test ! -e package/Assignment-01/report
          test ! -e package/Assignment-01/target
          test ! -e package/Assignment-01/reference
          test ! -e package/Assignment-01/benchmarks
          test ! -e package/Assignment-01/scripts
          test ! -e package/Assignment-01/verification
          test ! -e package/Assignment-01/README.md
          test ! -e package/Assignment-01/board.png
          test ! -e package/Assignment-01/run.sh
          test ! -e package/Assignment-01/requirements.txt

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-01-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}
