name: Assignment 1 Benchmark Plots CI

on:
  workflow_run:
    workflows:
      - Assignment 1 Benchmark CI
    types:
      - completed

jobs:
  plot:
    name: Generate benchmark plots
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare chart artifact metadata
        id: chart_meta
        shell: bash
        run: |
          set -euo pipefail

          stamp="$(date -u +'%Y%m%d-%H%M%S')-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "artifact_name=assignment-1-benchmark-charts-$stamp" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile benchmark analyzers
        working-directory: assignment-1
        run: mvn -B -DskipTests compile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: assignment-1-benchmark-results
          path: benchmarks/results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve benchmark input directory
        id: benchmark_input
        shell: pwsh
        run: |
          $summary = Get-ChildItem -Path benchmarks/results -Recurse -Filter benchmark-summary.csv | Sort-Object FullName | Select-Object -First 1
          if (-not $summary) {
            throw "benchmark-summary.csv not found in downloaded artifact"
          }
          "input_dir=$($summary.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate benchmark analysis tables
        run: java -cp assignment-1/target/classes pcd.poool.benchmark.BenchmarkScalabilityAnalyzer "${{ steps.benchmark_input.outputs.input_dir }}"

      - name: Generate charts
        run: python scripts/plot_benchmarks.py --input-dir "${{ steps.benchmark_input.outputs.input_dir }}" --output-dir benchmarks/charts

      - name: Upload chart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.chart_meta.outputs.artifact_name }}
          path: benchmarks/charts/**
          if-no-files-found: error
