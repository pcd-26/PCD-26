name: Assignment 1 Benchmark CI

on:
  pull_request:
    paths:
      - "assignment-1/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/assignment-1-benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "assignment-1/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/assignment-1-benchmark.yml"
  workflow_dispatch:
    inputs:
      benchmark_mode:
        description: "Benchmark mode"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full
      results_root:
        description: "Benchmark results root directory"
        required: false
        default: "benchmarks/results/ci"

jobs:
  benchmark:
    name: Run assignment-1 benchmarks
    runs-on: ubuntu-latest
    env:
      RESULTS_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.results_root || 'benchmarks/results/ci' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build assignment-1
        working-directory: assignment-1
        run: mvn -B clean verify

      - name: Run benchmark suite
        run: |
          if [ "${{ inputs.benchmark_mode }}" = "full" ]; then
            java -cp assignment-1/target/classes pcd.poool.benchmark.BenchmarkSuite --full "$RESULTS_ROOT"
          else
            java -cp assignment-1/target/classes pcd.poool.benchmark.BenchmarkSuite --smoke "$RESULTS_ROOT"
          fi

      - name: Upload benchmark CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assignment-1-benchmark-results
          path: ${{ env.RESULTS_ROOT }}/**
          if-no-files-found: error

  plots:
    name: Generate benchmark plots
    runs-on: ubuntu-latest
    needs: benchmark
    outputs:
      chart_stamp: ${{ steps.chart_archive_meta.outputs.stamp }}
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile benchmark analyzers
        working-directory: assignment-1
        run: mvn -B -DskipTests compile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: assignment-1-benchmark-results
          path: benchmarks/results

      - name: Resolve benchmark input directory
        id: benchmark_input
        shell: pwsh
        run: |
          $summary = Get-ChildItem -Path benchmarks/results -Recurse -Filter benchmark-summary.csv | Sort-Object FullName | Select-Object -First 1
          if (-not $summary) {
            throw "benchmark-summary.csv not found in downloaded artifact"
          }
          "input_dir=$($summary.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate benchmark analysis tables
        run: java -cp assignment-1/target/classes pcd.poool.benchmark.BenchmarkScalabilityAnalyzer "${{ steps.benchmark_input.outputs.input_dir }}"

      - name: Generate charts
        run: python scripts/plot_benchmarks.py --input-dir "${{ steps.benchmark_input.outputs.input_dir }}" --output-dir benchmarks/charts/report

      - name: Prepare chart archive metadata
        id: chart_archive_meta
        shell: bash
        run: |
          set -euo pipefail

          stamp="$(date -u +'%Y%m%d-%H%M%S')-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "zip_name=Assignment-01-benchmark-charts-$stamp.zip" >> "$GITHUB_OUTPUT"
          echo "release_zip_name=Assignment-01-benchmark-charts-latest.zip" >> "$GITHUB_OUTPUT"

      - name: Create chart archive
        shell: bash
        env:
          CHART_ZIP: ${{ steps.chart_archive_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -f "$CHART_ZIP"
          rm -rf chart-package
          mkdir -p chart-package/Assignment-01/charts
          cp -R benchmarks/charts/report chart-package/Assignment-01/charts/
          (cd chart-package && zip -r "../$CHART_ZIP" Assignment-01)

      - name: Check chart archive contents
        shell: bash
        env:
          CHART_ZIP: ${{ steps.chart_archive_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$CHART_ZIP"
          test -f chart-package/Assignment-01/charts/report/01_best_execution_time_vs_balls.png
          test -f chart-package/Assignment-01/charts/report/01_best_execution_time_vs_balls.svg

      - name: Upload chart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assignment-1-benchmark-charts-${{ steps.chart_archive_meta.outputs.stamp }}
          path: benchmarks/charts/report/**
          if-no-files-found: error

      - name: Publish chart archive to latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_ZIP: ${{ steps.chart_archive_meta.outputs.zip_name }}
          RELEASE_ZIP: ${{ steps.chart_archive_meta.outputs.release_zip_name }}
        run: |
          set -euo pipefail

          cp "$CHART_ZIP" "$RELEASE_ZIP"
          RELEASE_TAG="latest"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            :
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Latest Assignment Packages" \
              --notes "Shared release for assignment delivery zips and benchmark chart archives. New assets are appended on successful workflow runs."
          fi

          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" --clobber; then
              exit 0
            fi
            sleep "$attempt"
          done

          echo "failed to upload release asset after retries" >&2
          exit 1

  persist-snapshots:
    name: Persist benchmark snapshots
    runs-on: ubuntu-latest
    needs: plots
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: assignment-1-benchmark-results
          path: .benchmark-artifacts/results

      - name: Download benchmark charts
        uses: actions/download-artifact@v4
        with:
          name: assignment-1-benchmark-charts-${{ needs.plots.outputs.chart_stamp }}
          path: .benchmark-artifacts/charts

      - name: Resolve snapshot paths
        id: snapshot_paths
        shell: bash
        run: |
          set -euo pipefail

          results_summary="$(find .benchmark-artifacts/results -type f -name benchmark-summary.csv | head -n 1)"
          if [ -z "$results_summary" ]; then
            echo "benchmark-summary.csv not found in downloaded results artifact" >&2
            exit 1
          fi

          charts_sample="$(find .benchmark-artifacts/charts -type f \( -name '*.png' -o -name '*.svg' \) | head -n 1)"
          if [ -z "$charts_sample" ]; then
            echo "chart files not found in downloaded charts artifact" >&2
            exit 1
          fi

          results_dir="$(dirname "$results_summary")"
          charts_dir="$(dirname "$charts_sample")"
          stamp="$(basename "$results_dir")"

          echo "results_dir=$results_dir" >> "$GITHUB_OUTPUT"
          echo "charts_dir=$charts_dir" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Mirror benchmark snapshots into the repository
        shell: bash
        run: |
          set -euo pipefail

          stamp="${{ steps.snapshot_paths.outputs.stamp }}"
          results_target="benchmarks/results/official/$stamp"
          charts_target="benchmarks/charts/official/$stamp"

          rm -rf "$results_target" "$charts_target"
          mkdir -p "$(dirname "$results_target")" "$(dirname "$charts_target")"

          cp -R "${{ steps.snapshot_paths.outputs.results_dir }}" "$results_target"
          cp -R "${{ steps.snapshot_paths.outputs.charts_dir }}" "$charts_target"

      - name: Commit benchmark snapshots
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/official benchmarks/charts/official

          if git diff --cached --quiet; then
            echo "No benchmark snapshot changes to commit."
            exit 0
          fi

          git commit -m "chore(assignment-1): publish benchmark snapshot [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
