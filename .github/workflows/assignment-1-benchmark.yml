name: Assignment 1 Benchmark CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "assignment-1/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/assignment-1-benchmark.yml"
  workflow_dispatch:
    inputs:
      benchmark_mode:
        description: "Benchmark mode"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full
      results_root:
        description: "Benchmark results root directory"
        required: false
        default: "benchmarks/results/ci"

jobs:
  benchmark:
    name: Run assignment-1 benchmarks
    runs-on: ubuntu-latest
    env:
      RESULTS_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.results_root || 'benchmarks/results/ci' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build assignment-1
        working-directory: assignment-1
        run: mvn -B clean verify

      - name: Run benchmark suite
        run: |
          if [ "${{ inputs.benchmark_mode }}" = "full" ]; then
            java -cp assignment-1/target/classes pcd.poool.benchmark.BenchmarkSuite --full "$RESULTS_ROOT"
          else
            java -cp assignment-1/target/classes pcd.poool.benchmark.BenchmarkSuite --smoke "$RESULTS_ROOT"
          fi

      - name: Upload benchmark CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assignment-1-benchmark-results
          path: ${{ env.RESULTS_ROOT }}/**
          if-no-files-found: error
