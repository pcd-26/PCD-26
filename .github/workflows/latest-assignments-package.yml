name: Latest Assignments Package

on:
  workflow_run:
    workflows:
      - Assignment 01 CI
      - Assignment 02 CI
      - Assignment 03 CI
      - Assignment 04 CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: latest-assignments-package-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  assignment-1:
    name: Build assignment-1 package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r assignment-1/requirements.txt

      - name: Build and test
        working-directory: assignment-1
        run: mvn -B clean verify

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Build report PDF
        working-directory: assignment-1/report
        run: make

      - name: Prepare delivery metadata
        id: delivery_meta
        run: echo "zip_name=Assignment-01.zip" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-01/doc

          cp -R assignment-1/src package/Assignment-01/src
          cp assignment-1/report/report.pdf package/Assignment-01/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-01)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-01/doc/report.pdf
          test -d package/Assignment-01/src/main
          test -d package/Assignment-01/src/test
          test ! -e package/Assignment-01/pom.xml
          test ! -e package/Assignment-01/docs
          test ! -e package/Assignment-01/report
          test ! -e package/Assignment-01/target
          test ! -e package/Assignment-01/reference
          test ! -e package/Assignment-01/benchmarks
          test ! -e package/Assignment-01/scripts
          test ! -e package/Assignment-01/verification
          test ! -e package/Assignment-01/README.md
          test ! -e package/Assignment-01/board.png
          test ! -e package/Assignment-01/run.sh
          test ! -e package/Assignment-01/requirements.txt

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-01-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}

  assignment-2:
    name: Build assignment-2 package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Build and test
        working-directory: assignment-2
        run: mvn -B clean test

      - name: Prepare delivery metadata
        id: delivery_meta
        run: echo "zip_name=Assignment-02.zip" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-02/doc

          make -C assignment-2/report

          cp assignment-2/pom.xml package/Assignment-02/pom.xml
          cp -R assignment-2/src package/Assignment-02/src
          cp assignment-2/report/report.pdf package/Assignment-02/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-02)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-02/pom.xml
          test -d package/Assignment-02/src/main
          test -d package/Assignment-02/src/test
          test -f package/Assignment-02/doc/report.pdf
          test ! -e package/Assignment-02/docs
          test ! -e package/Assignment-02/report
          test ! -e package/Assignment-02/target
          test ! -e package/Assignment-02/.agents
          test ! -e package/Assignment-02/README.md
          test ! -e package/Assignment-02/run-cli.sh
          test ! -e package/Assignment-02/run-cli.ps1
          test ! -e package/Assignment-02/run-gui.sh
          test ! -e package/Assignment-02/run-gui.ps1

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-02-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}

  assignment-3:
    name: Build assignment-3 package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and test Smart Home Alarm System (Java)
        working-directory: assignment-3/smart-home-alarm-system
        run: mvn -B clean test

      - name: Build and test Heads-or-Tails Championship (Go)
        working-directory: assignment-3/heads-or-tails-championship/src
        run: go test -v ./...

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra zip unzip

      - name: Build Smart Home Alarm System report
        working-directory: assignment-3/smart-home-alarm-system/report
        run: make

      - name: Build Heads-or-Tails Championship report
        working-directory: assignment-3/heads-or-tails-championship/report
        run: make

      - name: Prepare delivery metadata
        id: delivery_meta
        run: echo "zip_name=Assignment-03.zip" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-03/smart-home-alarm-system/doc
          mkdir -p package/Assignment-03/heads-or-tails-championship/doc

          cp assignment-3/smart-home-alarm-system/pom.xml package/Assignment-03/smart-home-alarm-system/pom.xml
          cp -R assignment-3/smart-home-alarm-system/src package/Assignment-03/smart-home-alarm-system/src
          cp assignment-3/smart-home-alarm-system/report/report.pdf package/Assignment-03/smart-home-alarm-system/doc/report.pdf
          cp assignment-3/heads-or-tails-championship/report/report.pdf package/Assignment-03/heads-or-tails-championship/doc/report.pdf
          cp -R assignment-3/heads-or-tails-championship/src package/Assignment-03/heads-or-tails-championship/src

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-03)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-03/smart-home-alarm-system/doc/report.pdf
          test -f package/Assignment-03/heads-or-tails-championship/doc/report.pdf
          test -f package/Assignment-03/smart-home-alarm-system/pom.xml
          test -d package/Assignment-03/smart-home-alarm-system/src/main
          test -d package/Assignment-03/smart-home-alarm-system/src/test
          test -f package/Assignment-03/heads-or-tails-championship/src/main.go
          test -f package/Assignment-03/heads-or-tails-championship/src/go.mod
          test ! -e package/Assignment-03/doc
          test ! -e package/Assignment-03/report
          test ! -e package/Assignment-03/docs
          test ! -e package/Assignment-03/target
          test ! -e package/Assignment-03/smart-home-alarm-system/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-03-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}

  assignment-4:
    name: Build assignment-4 package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra zip unzip

      - name: Build CSHAS report
        working-directory: assignment-4/clustered-smart-home-alarm-system/report
        run: make

      - name: Build DTTT
        working-directory: assignment-4/distributed-tic-tac-toe
        run: mvn -B clean verify

      - name: Build DTTT report
        working-directory: assignment-4/distributed-tic-tac-toe/report
        run: make

      - name: Build DCS report
        working-directory: assignment-4/distributed-critical-sections/report
        run: make

      - name: Prepare delivery metadata
        id: delivery_meta
        run: echo "zip_name=Assignment-04.zip" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-04/clustered-smart-home-alarm-system/doc
          mkdir -p package/Assignment-04/distributed-tic-tac-toe/doc
          mkdir -p package/Assignment-04/distributed-critical-sections/doc

          cp assignment-4/clustered-smart-home-alarm-system/pom.xml package/Assignment-04/clustered-smart-home-alarm-system/pom.xml
          cp -R assignment-4/clustered-smart-home-alarm-system/src package/Assignment-04/clustered-smart-home-alarm-system/src
          cp assignment-4/clustered-smart-home-alarm-system/report/report.pdf package/Assignment-04/clustered-smart-home-alarm-system/doc/report.pdf
          cp assignment-4/distributed-tic-tac-toe/pom.xml package/Assignment-04/distributed-tic-tac-toe/pom.xml
          cp -R assignment-4/distributed-tic-tac-toe/src package/Assignment-04/distributed-tic-tac-toe/src
          cp assignment-4/distributed-tic-tac-toe/report/report.pdf package/Assignment-04/distributed-tic-tac-toe/doc/report.pdf
          cp assignment-4/distributed-critical-sections/pom.xml package/Assignment-04/distributed-critical-sections/pom.xml
          cp -R assignment-4/distributed-critical-sections/src package/Assignment-04/distributed-critical-sections/src
          cp assignment-4/distributed-critical-sections/report/report.pdf package/Assignment-04/distributed-critical-sections/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-04)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-04/clustered-smart-home-alarm-system/pom.xml
          test -d package/Assignment-04/clustered-smart-home-alarm-system/src/main
          test -d package/Assignment-04/clustered-smart-home-alarm-system/src/test
          test -f package/Assignment-04/clustered-smart-home-alarm-system/doc/report.pdf
          test -f package/Assignment-04/distributed-tic-tac-toe/pom.xml
          test -d package/Assignment-04/distributed-tic-tac-toe/src/main
          test -d package/Assignment-04/distributed-tic-tac-toe/src/test
          test -f package/Assignment-04/distributed-tic-tac-toe/doc/report.pdf
          test -f package/Assignment-04/distributed-critical-sections/pom.xml
          test -d package/Assignment-04/distributed-critical-sections/src/main
          test -d package/Assignment-04/distributed-critical-sections/src/test
          test -f package/Assignment-04/distributed-critical-sections/doc/report.pdf
          test ! -e package/Assignment-04/report
          test ! -e package/Assignment-04/docs
          test ! -e package/Assignment-04/target
          test ! -e package/Assignment-04/clustered-smart-home-alarm-system/target
          test ! -e package/Assignment-04/distributed-tic-tac-toe/target
          test ! -e package/Assignment-04/distributed-critical-sections/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-04-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}

  assemble:
    name: Build latest assignments package
    runs-on: ubuntu-latest
    needs:
      - assignment-1
      - assignment-2
      - assignment-3
      - assignment-4
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download assignment packages
        uses: actions/download-artifact@v4
        with:
          name: assignment-01-package
          path: bundle

      - name: Download assignment 2 package
        uses: actions/download-artifact@v4
        with:
          name: assignment-02-package
          path: bundle

      - name: Download assignment 3 package
        uses: actions/download-artifact@v4
        with:
          name: assignment-03-package
          path: bundle

      - name: Download assignment 4 package
        uses: actions/download-artifact@v4
        with:
          name: assignment-04-package
          path: bundle

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          git tag -f "$RELEASE_TAG" "$TARGET_SHA"
          git push origin --force "refs/tags/$RELEASE_TAG"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "Latest Assignments Package" \
              --notes "Unified package with all assignment delivery zips."
          else
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "Latest Assignments Package" \
              --notes "Unified package with all assignment delivery zips."
          fi

          while IFS= read -r asset_name; do
            if [ -n "$asset_name" ]; then
              gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' || true)

          gh release upload "$RELEASE_TAG" bundle/Assignment-01.zip --clobber
          gh release upload "$RELEASE_TAG" bundle/Assignment-02.zip --clobber
          gh release upload "$RELEASE_TAG" bundle/Assignment-03.zip --clobber
          gh release upload "$RELEASE_TAG" bundle/Assignment-04.zip --clobber
