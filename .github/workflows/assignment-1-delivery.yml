name: Assignment 1 Delivery Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test assignment-1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build and test assignment-1
        working-directory: assignment-1
        run: mvn -B clean verify

  package:
    name: Build Assignment-01 zip
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Build report PDF
        working-directory: assignment-1/report
        run: pdflatex -interaction=nonstopmode -halt-on-error -jobname=report main.tex

      - name: Create delivery package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package Assignment-01.zip
          mkdir -p package/Assignment-01

          cp -R assignment-1/. package/Assignment-01
          rm -rf \
            package/Assignment-01/docs \
            package/Assignment-01/report \
            package/Assignment-01/target

          mkdir -p package/Assignment-01/doc
          cp assignment-1/report/report.pdf package/Assignment-01/doc/report.pdf

          (cd package && zip -r ../Assignment-01.zip Assignment-01)

      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail

          unzip -l Assignment-01.zip
          test -f package/Assignment-01/doc/report.pdf
          test -f package/Assignment-01/pom.xml
          test -d package/Assignment-01/src/main
          test -d package/Assignment-01/src/test
          test ! -d package/Assignment-01/report
          test ! -d package/Assignment-01/docs
          test ! -d package/Assignment-01/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: Assignment-01
          path: Assignment-01.zip

      - name: Publish delivery release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: assignments-latest
        run: |
          set -euo pipefail

          release_stamp="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi

          gh release create "$RELEASE_TAG" Assignment-01.zip \
            --target "$GITHUB_SHA" \
            --title "Latest Assignment Delivery Packages" \
            --notes "Regenerated from main on ${release_stamp} after the corresponding assignment tests passed."
