name: Assignment 1 Delivery Package

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test assignment-1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build and test assignment-1
        working-directory: assignment-1
        run: mvn -B clean verify

  package:
    name: Build Assignment-01 zip
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare delivery metadata
        id: delivery_meta
        shell: bash
        run: |
          set -euo pipefail

          stamp="$(date -u +'%Y%m%d-%H%M%S')-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "zip_name=Assignment-01-$stamp.zip" >> "$GITHUB_OUTPUT"
          echo "release_tag=latest" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base zip unzip

      - name: Build report PDF
        working-directory: assignment-1/report
        run: pdflatex -interaction=nonstopmode -halt-on-error -jobname=report main.tex

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-01

          cp -R assignment-1/. package/Assignment-01
          rm -rf \
            package/Assignment-01/docs \
            package/Assignment-01/report \
            package/Assignment-01/target

          mkdir -p package/Assignment-01/doc
          cp assignment-1/report/report.pdf package/Assignment-01/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-01)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-01/doc/report.pdf
          test -f package/Assignment-01/pom.xml
          test -d package/Assignment-01/src/main
          test -d package/Assignment-01/src/test
          test ! -d package/Assignment-01/report
          test ! -d package/Assignment-01/docs
          test ! -d package/Assignment-01/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: Assignment-01-${{ steps.delivery_meta.outputs.stamp }}
          path: ${{ steps.delivery_meta.outputs.zip_name }}

      - name: Publish delivery release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
          RELEASE_TAG: ${{ steps.delivery_meta.outputs.release_tag }}
        run: |
          set -euo pipefail

          release_stamp="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DELIVERY_ZIP" --clobber
          else
            gh release create "$RELEASE_TAG" "$DELIVERY_ZIP" \
              --target "$GITHUB_SHA" \
              --title "Latest Assignment Packages" \
              --notes "Shared release for assignment delivery zips and benchmark chart archives. New assets are appended on successful workflow runs." \
            || gh release upload "$RELEASE_TAG" "$DELIVERY_ZIP" --clobber
          fi
