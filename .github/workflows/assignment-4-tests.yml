name: Assignment 04 CI

on:
  push:
    paths:
      - "assignment-4/**"
      - ".github/workflows/assignment-4-tests.yml"
  pull_request:
    paths:
      - "assignment-4/**"
      - ".github/workflows/assignment-4-tests.yml"
  workflow_dispatch:

concurrency:
  group: assignment-04-ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  cshas:
    name: Test assignment-04 Clustered Smart Home Alarm System
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run CSHAS validation
        working-directory: assignment-4/clustered-smart-home-alarm-system
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload CSHAS test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-4-clustered-smart-home-alarm-system-test-reports
          path: assignment-4/clustered-smart-home-alarm-system/target/surefire-reports
          if-no-files-found: ignore

  dttt:
    name: Test assignment-04 Distributed Tic-Tac-Toe
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run DTTT validation
        working-directory: assignment-4/distributed-tic-tac-toe
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload DTTT test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-4-distributed-tic-tac-toe-test-reports
          path: assignment-4/distributed-tic-tac-toe/target/surefire-reports
          if-no-files-found: ignore

  dcs:
    name: Test assignment-04 Distributed Critical Sections
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wait for RabbitMQ readiness
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..60}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/5672' >/dev/null 2>&1; then
              echo "RabbitMQ is ready"
              exit 0
            fi
            sleep 2
          done

          echo "RabbitMQ did not become ready in time"
          exit 1

      - name: Run DCS validation
        working-directory: assignment-4/distributed-critical-sections
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload DCS test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-4-distributed-critical-sections-test-reports
          path: assignment-4/distributed-critical-sections/target/surefire-reports
          if-no-files-found: ignore

  package:
    name: Build Assignment-04 zip
    runs-on: ubuntu-latest
    needs:
      - cshas
      - dttt
      - dcs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    concurrency:
      group: assignment-04-release-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra zip unzip

      - name: Build CSHAS report
        working-directory: assignment-4/clustered-smart-home-alarm-system/report
        run: make

      - name: Build DTTT report
        working-directory: assignment-4/distributed-tic-tac-toe/report
        run: make

      - name: Build DCS report
        working-directory: assignment-4/distributed-critical-sections/report
        run: make

      - name: Prepare delivery metadata
        id: delivery_meta
        shell: bash
        run: echo "zip_name=Assignment-04.zip" >> "$GITHUB_OUTPUT"

      - name: Create delivery package
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf package "$DELIVERY_ZIP"
          mkdir -p package/Assignment-04/clustered-smart-home-alarm-system/doc
          mkdir -p package/Assignment-04/distributed-tic-tac-toe/doc
          mkdir -p package/Assignment-04/distributed-critical-sections/doc

          cp assignment-4/clustered-smart-home-alarm-system/pom.xml package/Assignment-04/clustered-smart-home-alarm-system/pom.xml
          cp -R assignment-4/clustered-smart-home-alarm-system/src package/Assignment-04/clustered-smart-home-alarm-system/src
          cp assignment-4/clustered-smart-home-alarm-system/report/report.pdf package/Assignment-04/clustered-smart-home-alarm-system/doc/report.pdf
          cp assignment-4/distributed-tic-tac-toe/pom.xml package/Assignment-04/distributed-tic-tac-toe/pom.xml
          cp -R assignment-4/distributed-tic-tac-toe/src package/Assignment-04/distributed-tic-tac-toe/src
          cp assignment-4/distributed-tic-tac-toe/report/report.pdf package/Assignment-04/distributed-tic-tac-toe/doc/report.pdf
          cp assignment-4/distributed-critical-sections/pom.xml package/Assignment-04/distributed-critical-sections/pom.xml
          cp -R assignment-4/distributed-critical-sections/src package/Assignment-04/distributed-critical-sections/src
          cp assignment-4/distributed-critical-sections/report/report.pdf package/Assignment-04/distributed-critical-sections/doc/report.pdf

          (cd package && zip -r "../$DELIVERY_ZIP" Assignment-04)

      - name: Check package contents
        shell: bash
        env:
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          unzip -l "$DELIVERY_ZIP"
          test -f package/Assignment-04/clustered-smart-home-alarm-system/pom.xml
          test -d package/Assignment-04/clustered-smart-home-alarm-system/src/main
          test -d package/Assignment-04/clustered-smart-home-alarm-system/src/test
          test -f package/Assignment-04/clustered-smart-home-alarm-system/doc/report.pdf
          test -f package/Assignment-04/distributed-tic-tac-toe/pom.xml
          test -d package/Assignment-04/distributed-tic-tac-toe/src/main
          test -d package/Assignment-04/distributed-tic-tac-toe/src/test
          test -f package/Assignment-04/distributed-tic-tac-toe/doc/report.pdf
          test -f package/Assignment-04/distributed-critical-sections/pom.xml
          test -d package/Assignment-04/distributed-critical-sections/src/main
          test -d package/Assignment-04/distributed-critical-sections/src/test
          test -f package/Assignment-04/distributed-critical-sections/doc/report.pdf
          test ! -e package/Assignment-04/report
          test ! -e package/Assignment-04/docs
          test ! -e package/Assignment-04/target
          test ! -e package/Assignment-04/clustered-smart-home-alarm-system/target
          test ! -e package/Assignment-04/distributed-tic-tac-toe/target
          test ! -e package/Assignment-04/distributed-critical-sections/target

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: assignment-04-package
          path: ${{ steps.delivery_meta.outputs.zip_name }}

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: assignment-04-latest
          RELEASE_TITLE: Assignment 04 Delivery Package
          RELEASE_NOTES: Automated delivery zip for Assignment 04.
          DELIVERY_ZIP: ${{ steps.delivery_meta.outputs.zip_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi

          gh release upload "$RELEASE_TAG" "$DELIVERY_ZIP" --clobber
